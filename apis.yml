aid: trialspark
name: Formation Bio
description: 'Formation Bio (formerly TrialSpark, rebranded in December 2023) is a
  New York-based, tech-driven, AI-native pharmaceutical company co-founded by Ben Liu
  and Linhao Zhang. Rather than discovering molecules, Formation Bio in-licenses and
  acquires clinical-stage drug assets and runs them through a proprietary, software-
  and AI-driven development engine that compresses clinical planning, trial execution
  and regulatory work. That engine is a suite of internal platforms — Delphi (probability-of-technical-success
  and value modeling), Atlas (clinical-stage asset screening), Forge (autonomous trial
  design and scenario evaluation), Apollo (trial execution, study startup, enrollment
  and closeout), ARK (an AI orchestration layer connecting 80+ internal systems behind
  one governed interface) and a unified Data Platform spanning trial data, real-world
  patient data, literature and standardized ontologies. The company raised a $372M
  Series D led by Andreessen Horowitz with participation from Sanofi, and built Muse,
  an AI patient-recruitment system, with Sanofi and OpenAI. Formation Bio''s technology
  is internal-facing: as of this profile the company publishes no public developer
  portal, API documentation, machine-readable API contract, or client SDKs.'
